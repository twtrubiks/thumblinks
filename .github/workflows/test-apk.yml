name: Android test APK

# 給使用者在自己手機上試的 APK：跟 GitHub Release 的正式版用同一把發版金鑰簽，
# 可以直接覆蓋手機上的正式版（清單留著），之後的正式版也能直接蓋回去。
# VM 自己 build 的是那台機器的 debug 金鑰，跟正式版簽章對不上，只能移除重裝（清單會被刪掉），所以給使用者的一律用這個。
#
# 不發 Release、不建 tag，只上傳成 artifact（thumblinks-test-apk，留 7 天）：
# Claude 雲端 session 用 gh api 下載後傳給使用者；使用者也可以從這個 run 的頁面下載（zip 包著）。
# 推到 main 以外的 branch、改到 App 的程式碼時自動跑；只改文件不會觸發。
on:
  push:
    branches-ignore: [main, media]
    paths:
      - app/**
      - gradle/**
      - '*.gradle.kts'
      - gradle.properties
      - .github/workflows/test-apk.yml
  workflow_dispatch:

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 發版金鑰的憑證 SHA-256，跟 release.yml 的 EXPECTED_CERT 一樣
  EXPECTED_CERT: '31da42eafdc11db0ff013a606e9fa61db982502ca151cfa059a0ab5b8f1087a9'

jobs:
  build:
    name: Build test APK (arm64, release key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unpack signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::還沒有設定 ANDROID_SIGNING_KEYSTORE / ANDROID_SIGNING_PASSWORD（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/thumblinks-release.p12"

      # versionCode 跟正式版同一套（2026-01-01 起算的分鐘數）：比手機上的正式版大才蓋得上去，之後發的正式版又比它大。
      # versionName 是「最新的正式版 + test.<commit>」，在系統的應用程式資訊看得到是哪一份測試版
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "THUMBLINKS_VERSION_CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          echo "THUMBLINKS_VERSION_NAME=${latest#v}+test.${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          THUMBLINKS_KEYSTORE: ${{ runner.temp }}/thumblinks-release.p12
          THUMBLINKS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          # APK 按 CPU 拆開（GeckoView 每種 CPU 一份引擎），手機是 arm64-v8a
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/thumblinks-test-${GITHUB_SHA::7}.apk"

      - name: Verify signature
        shell: bash
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(ls dist/*.apk)
          out=$("$tools/apksigner" verify --verbose --print-certs "$apk" 2>&1)
          echo "$out"
          cert=$(printf '%s\n' "$out" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}' || true)
          if [ "$cert" != "$EXPECTED_CERT" ]; then
            echo "::error::簽名用的金鑰跟正式版不同（$cert），裝不上去。檢查 ANDROID_SIGNING_KEYSTORE"
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk" | head -1
          {
            echo "### 測試版 APK"
            echo "- 版本：$THUMBLINKS_VERSION_NAME（versionCode $THUMBLINKS_VERSION_CODE）"
            echo "- APK SHA-256：\`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- 發版金鑰簽的，可以直接覆蓋手機上的正式版"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: thumblinks-test-apk
          path: dist/*.apk
          retention-days: 7
          # APK 本身已經壓過了
          compression-level: 0
